<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Command Center Offline</title>
<style>
/* Layout: fixed left sidebar + scrolling work area; collapses to a top nav strip on phones.
   Palette mirrors the Command Center app (src/app/globals.css). */
:root {
  --bg: #f8f9fb;
  --fg: #1c2230;
  --card: #ffffff;
  --muted: #eef1f6;
  --muted-fg: #626b7d;
  --border: #e1e5ec;
  --input: #d5dbe5;
  --primary: #2f5fd0;
  --primary-fg: #ffffff;
  --primary-soft: #e7eefc;
  --sidebar: #f2f4f8;
  --success: #1f9d5c;
  --success-soft: #e3f5ea;
  --warning: #b77b0a;
  --warning-soft: #fbf1db;
  --orange: #d0631c;
  --orange-soft: #fcebdf;
  --danger: #cf3a2d;
  --danger-soft: #fbe6e4;
  --shadow: 0 10px 30px rgba(20, 30, 60, .14);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171e; --fg: #e9ecf2; --card: #1b1f28; --muted: #242a35; --muted-fg: #9aa3b4;
    --border: #2c3341; --input: #363e4e; --primary: #6d93f0; --primary-fg: #0f1420; --primary-soft: #222d47;
    --sidebar: #171b23; --success: #4cc48a; --success-soft: #19322a; --warning: #e2b049; --warning-soft: #352b15;
    --orange: #ef8f50; --orange-soft: #3a2518; --danger: #f07468; --danger-soft: #3b1f1d;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171e; --fg: #e9ecf2; --card: #1b1f28; --muted: #242a35; --muted-fg: #9aa3b4;
  --border: #2c3341; --input: #363e4e; --primary: #6d93f0; --primary-fg: #0f1420; --primary-soft: #222d47;
  --sidebar: #171b23; --success: #4cc48a; --success-soft: #19322a; --warning: #e2b049; --warning-soft: #352b15;
  --orange: #ef8f50; --orange-soft: #3a2518; --danger: #f07468; --danger-soft: #3b1f1d;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

/* Shell */
.shell { display: grid; grid-template-columns: 228px 1fr; min-height: 100%; }
.side { background: var(--sidebar); border-right: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--primary); color: var(--primary-fg); display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: .02em; }
.brand-name { font-weight: 650; line-height: 1.15; }
.brand-sub { font-size: 11px; color: var(--muted-fg); text-transform: uppercase; letter-spacing: .08em; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 7px 10px; border-radius: 6px; text-align: left; color: var(--muted-fg); white-space: nowrap; }
.nav button:hover { background: var(--muted); color: var(--fg); }
.nav button.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.nav svg { width: 16px; height: 16px; flex: none; }
.nav-count { margin-left: auto; font-size: 11px; background: var(--danger-soft); color: var(--danger); border-radius: 999px; padding: 0 7px; font-weight: 600; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.top h1 { font-size: 18px; font-weight: 650; margin-right: auto; }
.search { position: relative; width: min(320px, 100%); }
.search input { width: 100%; padding: 7px 10px 7px 32px; border-radius: 6px; border: 1px solid var(--input); background: var(--card); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted-fg); }
.kbd { font: 11px var(--mono); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; color: var(--muted-fg); background: var(--card); }
.view { padding: 20px 24px 48px; display: flex; flex-direction: column; gap: 20px; max-width: 1240px; width: 100%; }

/* Controls */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--input); background: var(--card); padding: 6px 12px; border-radius: 6px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--muted); }
.btn svg { width: 15px; height: 15px; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.btn-primary:hover { background: color-mix(in srgb, var(--primary) 88%, var(--fg)); }
.btn-danger { color: var(--danger); }
.btn-danger-solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-sm { padding: 3px 8px; font-size: 12.5px; }
.icon-btn { border: 0; background: transparent; padding: 4px; border-radius: 5px; color: var(--muted-fg); display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--muted); color: var(--fg); }
.icon-btn svg { width: 15px; height: 15px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; color: var(--muted-fg); font-weight: 500; }
.inp, select.inp, textarea.inp { width: 100%; border: 1px solid var(--input); background: var(--card); border-radius: 6px; padding: 6px 9px; min-width: 0; }
textarea.inp { resize: vertical; min-height: 70px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.muted { color: var(--muted-fg); }
.small { font-size: 12.5px; }

/* Surfaces */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); }
.card-h { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.card-h h2 { font-size: 14px; font-weight: 650; margin-right: auto; }
.card-b { padding: 12px 16px; }
.section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted-fg); font-weight: 600; }
.cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.cols-even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.empty { padding: 22px 16px; text-align: center; color: var(--muted-fg); }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r); background: var(--primary-soft); color: var(--fg); border: 1px solid color-mix(in srgb, var(--primary) 25%, transparent); }
.banner p { margin: 0; margin-right: auto; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { padding: 14px 16px; border: 1px solid var(--border); background: var(--card); border-radius: var(--r); text-align: left; display: flex; flex-direction: column; gap: 2px; }
button.stat:hover { border-color: var(--input); background: var(--muted); }
.stat-n { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat-l { color: var(--muted-fg); font-size: 12.5px; }
.stat.is-danger .stat-n { color: var(--danger); }
.stat.is-warn .stat-n { color: var(--orange); }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 1px 8px; white-space: nowrap; background: var(--muted); color: var(--muted-fg); }
.p-CRITICAL { background: var(--danger-soft); color: var(--danger); }
.p-HIGH { background: var(--orange-soft); color: var(--orange); }
.p-MEDIUM { background: var(--primary-soft); color: var(--primary); }
.p-LOW { background: var(--muted); color: var(--muted-fg); }
.due-overdue { background: var(--danger-soft); color: var(--danger); }
.due-today { background: var(--warning-soft); color: var(--warning); }
.due-thisWeek { background: var(--primary-soft); color: var(--primary); }
.s-IN_PROGRESS { background: var(--primary-soft); color: var(--primary); }
.s-BLOCKED { background: var(--danger-soft); color: var(--danger); }
.s-WAITING { background: var(--warning-soft); color: var(--warning); }
.s-COMPLETED { background: var(--success-soft); color: var(--success); }
.h-GREEN { background: var(--success-soft); color: var(--success); }
.h-YELLOW { background: var(--warning-soft); color: var(--warning); }
.h-ORANGE { background: var(--orange-soft); color: var(--orange); }
.h-RED { background: var(--danger-soft); color: var(--danger); }
.dot { width: 9px; height: 9px; border-radius: 3px; flex: none; display: inline-block; }
.bar { height: 6px; background: var(--muted); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: inherit; }
.bar.ok > i { background: var(--success); }
.bar.over > i { background: var(--danger); }

/* Task line */
.tlist { display: flex; flex-direction: column; }
.tl { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--border); min-width: 0; }
.tl:last-child { border-bottom: 0; }
.tl:hover { background: color-mix(in srgb, var(--muted) 55%, transparent); }
.chk { width: 18px; height: 18px; flex: none; border-radius: 50%; border: 1.5px solid var(--input); background: var(--card); display: grid; place-items: center; padding: 0; color: transparent; }
.chk:hover { border-color: var(--success); color: var(--success); }
.chk svg { width: 11px; height: 11px; }
.is-done .chk { background: var(--success); border-color: var(--success); color: #fff; }
.chk.sq { border-radius: 4px; }
.tl-main { flex: 1; min-width: 0; overflow: hidden; border: 0; background: transparent; text-align: left; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.tl-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.is-done .tl-title { text-decoration: line-through; color: var(--muted-fg); }
.tl-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted-fg); align-items: center; }
.tl-meta span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.tl-meta svg { width: 12px; height: 12px; flex: none; }
.tl-badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.star { border: 0; background: transparent; padding: 3px; color: var(--input); border-radius: 5px; display: grid; place-items: center; }
.star svg { width: 16px; height: 16px; }
.star:hover { color: var(--warning); }
.star.on { color: var(--warning); }
.star.on svg { fill: currentColor; }
.depth-1 { padding-left: 40px; }
.depth-2 { padding-left: 68px; }
.depth-3 { padding-left: 96px; }
.reasons { font-size: 12px; color: var(--muted-fg); }
.score { font: 600 12px var(--mono); color: var(--primary); min-width: 30px; text-align: right; }

/* Projects */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.pcard { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; text-align: left; border: 1px solid var(--border); background: var(--card); border-radius: var(--r); }
.pcard:hover { border-color: var(--input); }
.pcard h3 { font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.pcard p { margin: 0; color: var(--muted-fg); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.prow { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); width: 100%; border-left: 0; border-right: 0; border-top: 0; background: transparent; text-align: left; }
.prow:last-child { border-bottom: 0; }
.prow:hover { background: var(--muted); }
.prow-name { flex: 1; min-width: 0; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .bar { width: 90px; }
.phead { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.phead h2 { font-size: 20px; display: flex; gap: 10px; align-items: center; }
.phead p { margin: 0; color: var(--muted-fg); max-width: 70ch; white-space: pre-line; }
.facts { display: flex; gap: 22px; flex-wrap: wrap; }
.fact { display: flex; flex-direction: column; gap: 2px; }
.fact b { font-weight: 600; font-variant-numeric: tabular-nums; }
.phase-h { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--muted); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.phase-h h3 { font-size: 13.5px; font-weight: 650; }
.phase-h .bar { width: 80px; }
.phase-h .sp { margin-left: auto; display: flex; gap: 2px; }
.phase-block + .phase-block { border-top: 1px solid var(--border); }

/* Board */
.board-wrap { overflow-x: auto; padding-bottom: 6px; }
.board { display: grid; grid-template-columns: repeat(6, minmax(220px, 1fr)); gap: 12px; min-width: 1360px; }
.col { background: var(--muted); border-radius: var(--r); padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 260px; border: 2px solid transparent; }
.col.drop { border-color: var(--primary); background: var(--primary-soft); }
.col-h { display: flex; align-items: center; gap: 8px; padding: 4px 6px; font-weight: 600; font-size: 13px; }
.col-h .n { color: var(--muted-fg); font-weight: 500; }
.bcard { background: var(--card); border: 1px solid var(--border); border-radius: 7px; padding: 9px 10px; display: flex; flex-direction: column; gap: 6px; cursor: grab; text-align: left; }
.bcard:hover { border-color: var(--input); }
.bcard.dragging { opacity: .45; }
.bcard-t { font-weight: 500; }
.bcard .row { gap: 6px; }

/* Calendar */
.cal-wrap { overflow-x: auto; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); min-width: 700px; border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
.cal-dow { padding: 6px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted-fg); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--muted); }
.cal-day { min-height: 108px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 4px 5px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cal-day.out { background: color-mix(in srgb, var(--muted) 45%, transparent); }
.cal-day.out .cal-n { color: var(--muted-fg); }
.cal-n { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; align-self: flex-start; padding: 1px 6px; border-radius: 999px; }
.cal-day.is-today .cal-n { background: var(--primary); color: var(--primary-fg); }
.cal-item { border: 0; text-align: left; font-size: 12px; padding: 2px 6px; border-radius: 4px; background: var(--primary-soft); color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 3px solid var(--primary); }
.cal-item.done { opacity: .55; text-decoration: line-through; }
.cal-item.next { background: transparent; border-style: dashed; border-width: 1px 1px 1px 3px; border-color: var(--border); }
.cal-item svg { width: 10px; height: 10px; vertical-align: -1px; }

/* Overlays */
.overlay { position: fixed; inset: 0; background: rgba(10, 14, 24, .38); z-index: 40; display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; }
.modal { background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); width: min(560px, 100%); max-height: 84vh; overflow: auto; }
.modal-h { display: flex; align-items: center; padding: 14px 18px 0; gap: 8px; }
.modal-h h2 { font-size: 16px; margin-right: auto; }
.modal-b { padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; }
.modal-f { padding: 0 18px 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.drawer-ov { justify-content: flex-end; padding: 0; align-items: stretch; }
.drawer { background: var(--card); border-left: 1px solid var(--border); box-shadow: var(--shadow); width: min(560px, 100%); height: 100%; overflow: auto; display: flex; flex-direction: column; }
.drawer-h { position: sticky; top: 0; background: var(--card); z-index: 1; padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.drawer-h .crumb { margin-right: auto; font-size: 12.5px; color: var(--muted-fg); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-width: 0; }
.crumb button { border: 0; background: transparent; padding: 0; color: var(--primary); }
.drawer-b { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.title-inp { font-size: 18px; font-weight: 650; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; margin-left: -6px; width: calc(100% + 6px); background: transparent; }
.title-inp:hover, .title-inp:focus { border-color: var(--input); background: var(--card); }
.sub-list { border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.sub-list .tl { padding: 6px 10px; }
.cl-item { display: flex; gap: 8px; align-items: center; padding: 4px 2px; }
.cl-item .t { flex: 1; min-width: 0; }
.cl-item.done .t { text-decoration: line-through; color: var(--muted-fg); }
.add-inline { display: flex; gap: 6px; }
.add-inline .inp { flex: 1; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; min-height: 22px; }
.days { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.days label { cursor: pointer; }
.days input { position: absolute; opacity: 0; pointer-events: none; }
.days label span { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 30px; padding: 0 6px; border: 1px solid var(--input); border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--muted-fg); background: var(--card); }
.days input:checked + span { background: var(--primary); border-color: var(--primary); color: var(--primary-fg, #fff); }
.days input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 1px; }
.days .linkish { margin-left: 4px; font-size: 12px; }
.days.compact label span { min-width: 30px; height: 26px; }
.grid3 { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 12px; }
.hint svg, .chip svg, .small svg { width: 13px; height: 13px; vertical-align: -2px; flex-shrink: 0; }
.rv-row { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.rv-row:first-child { border-top: 0; }
.rv-row .tl-main { flex: 1; min-width: 220px; }
.rv-acts { display: flex; gap: 6px; flex-wrap: wrap; }
.rv-step { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--primary); color: var(--primary-fg, #fff); font-size: 12px; font-weight: 600; }
.inbox-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.inbox-item:first-child { border-top: 0; }
.inbox-item .t { flex: 1; min-width: 200px; }
.focus-modal { width: min(680px, 100%); }
.modal-h h2 svg { width: 18px; height: 18px; color: var(--primary); }
.focus-title { font-size: 22px; font-weight: 600; line-height: 1.3; margin: 0; }
.focus-clock { font: 600 64px/1 var(--mono); letter-spacing: -1px; text-align: center; padding: 8px 0 2px; font-variant-numeric: tabular-nums; }
.focus-phase { text-align: center; font-size: 13px; color: var(--muted-fg); min-height: 18px; }
.focus-phase.brk { color: var(--success); font-weight: 600; }
.focus-bar { height: 6px; border-radius: 999px; background: var(--muted); overflow: hidden; }
.focus-bar i { display: block; height: 100%; background: var(--primary); transition: width .9s linear; }
.focus-bar.brk i { background: var(--success); }
.focus-ctl { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.game-side { margin: 4px 0 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r); background: var(--card); text-align: left; display: flex; flex-direction: column; gap: 6px; width: 100%; color: var(--fg); cursor: pointer; }
.game-side:hover { border-color: var(--primary); }
.game-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.game-row b { font-size: 13px; }
.game-row .sp { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; color: var(--muted-fg); }
.game-row .sp.on { color: #e8590c; font-weight: 600; }
.game-row svg { width: 14px; height: 14px; }
.xpbar { height: 6px; border-radius: 999px; background: var(--muted); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .6s ease; }
.ring { display: block; }

/* ---------- Dates (local calendar days as YYYY-MM-DD) ---------- */
const pad = (n) => String(n).padStart(2, "0");

const toDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

function filteredTasks() {
  const f = ui.filters;
  let list = db.tasks.filter((t) => {
    if (f.project === "none" ? t.projectId : f.project !== "all" && t.projectId !== f.project) return false;
    if (f.status === "open" && isClosed(t.status)) return false;
    if (f.status === "stuck" && !(t.status === "BLOCKED" || t.status === "WAITING")) return false;
    if (STATUS[f.status] && t.status !== f.status) return false;
    if (f.priority !== "all" && t.priority !== f.priority) return false;
    if (f.due !== "all" && bucket(t) !== f.due) return false;
    return true;
  });
  if (f.sort === "score") return ranked(list);
  const cmp = {
    due: (a, b) => (a.dueDate || "9999").localeCompare(b.dueDate || "9999") || PRANK[a.priority] - PRANK[b.priority],
    priority: (a, b) => PRANK[a.priority] - PRANK[b.priority] || (a.dueDate || "9999").localeCompare(b.dueDate || "9999"),
    created: (a, b) => b.createdAt.localeCompare(a.createdAt),
  }[f.sort];
  return list.sort(cmp);
}

function wireBoard() {
  document.querySelectorAll(".bcard").forEach((c) => {
    c.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", c.dataset.card); e.dataTransfer.effectAllowed = "move"; c.classList.add("dragging"); });
    c.addEventListener("dragend", () => c.classList.remove("dragging"));
  });
  document.querySelectorAll(".col").forEach((col) => {
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("drop"); });
    col.addEventListener("dragleave", (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove("drop"); });
    col.addEventListener("drop", (e) => {
      e.preventDefault(); col.classList.remove("drop");
      const t = taskById(e.dataTransfer.getData("text/plain"));
      if (t && t.status !== col.dataset.col) { const moved = setStatus(t, col.dataset.col); save(); render(); toast(moved ? `Done. Next on ${fmtDate(t.dueDate, { weekday: "short", month: "short", day: "numeric" })}` : `Moved to ${STATUS[t.status]}`); }
    });
  });
}

function viewCalendar() {
  const [y, m] = ui.calMonth.split("-").map(Number);
  const first = new Date(y, m - 1, 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const td = today();
  const byDay = new Map();
  const last = new Date(start); last.setDate(start.getDate() + 41);
  for (const t of db.tasks) {
    if (t.status === "CANCELLED") continue;
    for (const o of occurrencesIn(t, ymd(start), ymd(last))) { if (!byDay.has(o.date)) byDay.set(o.date, []); byDay.get(o.date).push({ t, ...o }); }
  }
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = ymd(d);
    const items = (byDay.get(key) || []).sort((a, b) => Number(a.done) - Number(b.done) || (a.t.dueTime || "99").localeCompare(b.t.dueTime || "99") || PRANK[a.t.priority] - PRANK[b.t.priority]);
    const payMark = db.pay.amount > 0 && periodStartOf(key) === key ? `<span class="cal-pay">Pay period starts</span>` : "";
    const hrs = dayHours(key);
    cells.push(`<div class="cal-day ${d.getMonth() !== m - 1 ? "out" : ""} ${key === td ? "is-today" : ""}"><span class="cal-n">${d.getDate()}${hrs ? ` <span class="small muted num" title="Hours on the clock">· ${esc(fmtHours(hrs))}</span>` : ""}</span>${payMark}
      ${items.map(({ t, done, next }) => { const p = projById(t.projectId); return `<button class="cal-item ${done ? "done" : ""} ${next ? "next" : ""}" style="border-left-color:${esc(p ? p.color : "var(--muted-fg)")}" data-act="open-task" data-id="${t.id}" title="${esc(t.title + (t.dueTime ? " · " + fmtSlot(t) : "") + (t.repeat ? " · " + repeatLabel(t.repeat.days) : ""))}">${t.repeat ? I.repeat + " " : ""}${t.dueTime ? `<b class="num">${esc(fmtTime(t.dueTime))}</b> ` : ""}${esc(t.title)}</button>`; }).join("")}</div>`);
    if (i >= 34 && d.getMonth() !== m - 1 && (i + 1) % 7 === 0) break;
  }
  return `<div class="row"><button class="btn btn-sm" data-act="cal-move" data-n="-1" aria-label="Previous month">${I.left}</button>
    <h2 style="font-size:16px;min-width:150px;text-align:center">${first.toLocaleDateString(undefined, { month: "long", year: "numeric" })}</h2>
    <button class="btn btn-sm" data-act="cal-move" data-n="1" aria-label="Next month">${I.right}</button>
    <button class="btn btn-sm btn-ghost" data-act="cal-today">Today</button><span class="hint">Tasks appear on their due date. Repeating tasks show on each repeat day.</span></div>
  <div class="card cal-wrap"><div class="cal">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d) => `<div class="cal-dow">${d}</div>`).join("")}${cells.join("")}</div></div>`;
}

function viewSearch() {
  const q = ui.q.trim().toLowerCase();

  const projects = db.projects.filter((p) => (p.name + " " + p.description).toLowerCase().includes(q));

    const ph = phaseById(t.phaseId);
    const hay = [t.title, t.description, (t.tags || []).join(" "), (t.checklist || []).map((c) => c.text).join(" "), ph ? ph.name : ""].join(" ").toLowerCase();

/** Reads the Add task form into task fields. */
function quickAddFields() {
  const r = parseQuickAdd($("#qa-text").value);

  const days = pickedDays("qa-day");
  const projectId = v("qa-project") || null;
  const f = {

    priority: v("qa-priority") || "MEDIUM", tags: r.tags, repeat: days.length ? { days, until: null } : null,
  };

  if (f.endTime && !slotMinutes(f.dueTime, f.endTime)) f.endTime = null;

const FILLER = /^(?:(?:and|also|then|so|plus|after that|afterwards|finally|first|second|third|lastly|ok|okay|um|uh|oh)\b[,\s]*|(?:i|we)\s+(?:also\s+)?(?:need|have|got|want|should|must|gotta|ought)\s+(?:to\s+)?|(?:need|have|got|want)\s+to\s+|remember\s+to\s+|(?:don'?t|do not)\s+forget\s+to\s+|make\s+sure\s+(?:to\s+|i\s+|we\s+)?|please\s+|let'?s\s+|(?:i|we)'?ll\s+|(?:i|we)\s+will\s+|(?:i'?m|i\s+am|we'?re|we\s+are)\s+going\s+to\s+|gotta\s+)/i;

/** A piece only stands as its own task when it has at least two words of real action left after dates etc. are removed. */

  return rest.split(/\s+/).filter(Boolean).length >= 2;
}
const CLAUSE_SEP = /(\s*,?\s*\b(?:and then|after that|and also|then|also|plus)\b\s*|\s*;\s*|\s*,\s*(?:and\s+)?|\s+and\s+)/i;

function ruleSplit(text) {

  for (const line of lines) {
    const sentences = line.replace(/([.!?;])\s+/g, "$1\u0001").split("\u0001").map((s) => s.trim()).filter(Boolean);
    for (const sentence of sentences) {
      const whole = parseQuickAdd(stripFillers(sentence));
      const sentProject = matchProject(whole.projectHint) || findProject(sentence);
      for (const clause of splitClauses(sentence)) {
        const r = parseQuickAdd(stripFillers(clause));
        const title = cleanTitle(r.title);
        if (!title) continue;
        const proj = matchProject(r.projectHint) || findProject(clause) || sentProject;
        const projectId = proj ? proj.id : smart.projectId || null;
        const phase = findPhase(projectId, clause);
        items.push({
          include: true, title, dueDate: r.dueDate || whole.dueDate, dueTime: r.dueTime, endTime: r.endTime, repeatDays: r.repeatDays || [], priority: r.priority || "MEDIUM",
          estimatedMinutes: r.estimatedMinutes, tags: r.tags.length ? r.tags : whole.tags, notes: "",
          projectId, phaseId: phase ? phase.id : projectId && projectId === smart.projectId ? smart.phaseId || null : null, fromText: !!proj,
        });

}

/** Fetch wrapper shared by the AI services: turns network and HTTP failures into readable messages. */
async function aiFetch(name, url, opts, readError) {

  try { res = await fetch(url, opts); }
  catch (e) { throw new Error(`Could not reach ${name}. Check your internet connection (the claude.ai preview also blocks this; use your website or the downloaded file)`); }
  if (res.ok) return res.json();
  let msg = ""; try { msg = readError(await res.json()) || ""; } catch (e) { /* not JSON */ }
  if (res.status === 401 || res.status === 403 || (res.status === 400 && /api key/i.test(msg))) throw new Error(`${name} rejected the API key. Check it under Data & backup`);
  if (res.status === 429) throw new Error(`${name} is rate limiting this key right now (free tiers have daily limits)`);
  const err = new Error(`${name} returned an error (${res.status})${msg ? ": " + msg : ""}`); err.status = res.status;

}

  if (sc.anyOf) { const real = sc.anyOf.find((x) => x.type !== "null"); return { ...geminiSchema(real), nullable: true }; }
  const out = {};

    if (k === "additionalProperties") continue;

    out[k] = k === "properties" ? Object.fromEntries(Object.entries(v).map(([pk, pv]) => [pk, geminiSchema(pv)])) : geminiSchema(v);
  }

}

/* ---------- Tracker page ---------- */
function barChart(data, { goal = null, fmt = (v) => String(v), label = "", max = null } = {}) {

  data.forEach((d, i) => {
    const x = L + i * bw + (bw - w) / 2;
    if (d.v != null && d.v > 0) {
      const h = H - B - y(d.v), r = Math.min(4, h, w / 2);
      out += `<path class="bar" d="M${x},${H - B} V${y(d.v) + r} Q${x},${y(d.v)} ${x + r},${y(d.v)} H${x + w - r} Q${x + w},${y(d.v)} ${x + w},${y(d.v) + r} V${H - B} Z"><title>${esc(d.label)}: ${esc(d.tip || fmt(d.v))}</title></path>`;
    }
    out += `<rect x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent"><title>${esc(d.label)}: ${esc(d.v == null ? "no data" : d.tip || fmt(d.v))}</title></rect>`;
    if (i % 2 === (data.length - 1) % 2) out += `<text class="ax" x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${esc(d.short || d.label)}</text>`;
  });

  if (last && last.v) out += `<text class="vl" x="${L + lastI * bw + bw / 2}" y="${y(last.v) - 5}" text-anchor="middle">${esc(fmt(last.v))}</text>`;
  if (goal) out += `<line class="goal" x1="${L}" x2="${W - R}" y1="${y(goal)}" y2="${y(goal)}"/><text class="ax" x="${W - R}" y="${y(goal) - 5}" text-anchor="end">Goal ${esc(fmt(goal))}</text>`;

}

const MEETING_SAMPLE = "Pharmacy leadership huddle\nDiscussed the Pyxis go-live timeline and staffing for nights.\nDecision: go live on cabinet 3 first.\n\nAction items:\n- Sam to confirm hardware delivery dates by Thursday\n- I'll update the formulary mapping tomorrow, high priority\n- Dana will draft the night shift schedule by next Monday\n- Follow up with nursing on super-user training (Lee)";
const ACTION_HEAD = /^(?:action\s+items?|actions?|next\s+steps?|follow[- ]?ups?|to[- ]?dos?|tasks?|ais?|owners?)\s*:?\s*$/i;
const ACTION_PREFIX = /^(?:action(?:\s+items?)?|ai|todo|to[- ]do|follow[- ]?up|next\s+step)\s*[:\-–]\s*/i;
const NOT_NAME = /^(?:the|this|that|these|those|it|they|there|team|everyone|all|he|she|you|next|action|actions|todo|notes?|meeting|agenda|decision|decisions|discussion|discussed|update|updates|budget|pricing|cost|plan|timeline|status|summary|attendees|date|time|topic|item|items|we'?ll)$/i;

const COLON_OWNER_RX = /^@?([A-Z][\w'’.-]*(?:\s[A-Z][\w'’-]+)?)\s*[:\-–]\s+(.+)$/;

function meetingSplit(text) {
  const items = [];

    if (!title) return;
    const proj = findProject(line);
    items.push({ include: true, title, owner: owner && !ME_RX.test(owner) ? owner : null, dueDate: r.dueDate, dueTime: r.dueTime, endTime: r.endTime, repeatDays: r.repeatDays || [], priority: r.priority || "MEDIUM",

  };

    let line = raw.trim();

    if (paren && isName(paren[1])) { owner = owner || paren[1]; line = line.slice(0, paren.index); isAction = true; }
    const om = line.match(OWNER_RX);
    if (om && (isName(om[1]) || ME_RX.test(om[1]))) { owner = owner || om[1]; line = om[2]; isAction = true; }

}

function focusTick() {
  if (!focus.end) return;
  if (Date.now() < focus.end) { paintFocus(); return; }
  clearInterval(focus.timer); focus.timer = null; focus.end = 0;
  beep(); setTimeout(beep, 350);
  if (focus.phase === "work") {
    logFocus(); focus.rounds++;
    const brk = focus.total >= 50 * 60e3 ? 10 : 5;
    focus.phase = "break"; focus.total = focus.left = brk * 60e3;
    toast(`Nice work. Take a ${brk}-minute break.`);
    focusToggle();
  } else {
    focus.phase = "work"; focus.total = focus.left = (Number(lsGet("command-center-offline-focus-min")) || 25) * 60e3;
    toast("Break's over.");
    paintFocus();
  }
}
function focusToggle() {
  if (focus.end) { // pause
    focus.left = focus.end - Date.now(); focus.end = 0; clearInterval(focus.timer); focus.timer = null;
    if (focus.phase === "work") logFocus();
  } else {
    focus.end = Date.now() + focus.left;
    if (focus.phase === "work") focus.workedFrom = Date.now();
    focus.timer = setInterval(focusTick, 250);
  }
  paintFocus();
}
function focusReset() {
  if (focus.end && focus.phase === "work") logFocus();
  clearInterval(focus.timer); focus.timer = null; focus.end = 0; focus.phase = "work";
  focus.total = focus.left = (Number(lsGet("command-center-offline-focus-min")) || 25) * 60e3;
  paintFocus();
}
function focusSetLength(min) {
  lsSet("command-center-offline-focus-min", String(min));
  if (focus.phase === "work") { if (focus.end) logFocus(); clearInterval(focus.timer); focus.timer = null; focus.end = 0; focus.total = focus.left = min * 60e3; }
  paintFocus(); toast(`Focus length set to ${min} minutes`);
}
/** Adds the time worked since the last log to the task and to the week's focus log. */
function logFocus() {
  if (!focus.workedFrom) return;
  const ms = Date.now() - focus.workedFrom; focus.workedFrom = focus.end && focus.phase === "work" ? Date.now() : 0;
  focus.workedMs += ms;
  const min = Math.floor(focus.workedMs / 60e3);
  if (min < 1) return;
  focus.workedMs -= min * 60e3;
  const t = taskById(focus.taskId); if (!t) return;
  t.focusMinutes = (t.focusMinutes || 0) + min;
  focus.xpMin = (focus.xpMin || 0) + min;
  if (focus.xpMin >= 5) { const x = Math.floor(focus.xpMin / 5); focus.xpMin -= x * 5; gameAward(x, `Focus on ${t.title}`, t.id, "focus"); }
  db.focusLog.push({ date: today(), taskId: t.id, minutes: min });
  db.focusLog = db.focusLog.filter((x) => daysFromToday(x.date) > -120);
  if (t.status === "NOT_STARTED" || t.status === "PLANNED") t.status = "IN_PROGRESS";
  save(); paintFocusTask();
}
function endFocus() {
  if (focus.end && focus.phase === "work") logFocus();
  clearInterval(focus.timer); focus.timer = null; focus.end = 0; focus.taskId = null;
  document.title = "Command Center Offline";
  render();
}

/* ---------- Weekly review ---------- */
function reviewRow(t, acts) {
  const p = projById(t.projectId);
  const meta = [p ? `${projDot(p)}${esc(p.name)}` : "", t.dueDate ? esc(isClosed(t.status) ? fmtDate(t.dueDate) : fmtDue(t.dueDate)) : "", t.owner ? `${I.user}${esc(t.owner)}` : "", `added ${esc(ago(t.createdAt))}`].filter(Boolean);
  return `<div class="rv-row"><button class="tl-main" data-act="open-task" data-id="${t.id}"><span class="tl-title">${esc(t.title)}</span><span class="tl-meta"><span>${meta.join(" · ")}</span></span></button><span class="rv-acts">${acts}</span></div>`;
}
function viewReview() {
  const td = today(), weekAgo = addDays(td, -7);
  const open = db.tasks.filter((t) => !isClosed(t.status));
  const doneTasks = db.tasks.filter((t) => t.status === "COMPLETED" && t.completedAt && ymd(new Date(t.completedAt)) > weekAgo);
  const routineDone = db.tasks.reduce((n, t) => n + (t.doneDates || []).filter((d) => d > weekAgo && d <= td).length, 0);
  const focusMin = db.focusLog.filter((x) => x.date > weekAgo).reduce((s, x) => s + x.minutes, 0);
  const slipped = open.filter((t) => bucket(t) === "overdue").sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  const stale = open.filter((t) => !t.dueDate && !t.repeat && !hasChildren(t.id) && ["NOT_STARTED", "PLANNED"].includes(t.status) && (Date.now() - new Date(t.createdAt)) > 14 * 864e5 && !(t.reviewedAt && daysFromToday(t.reviewedAt) > -14));
  const waiting = open.filter((t) => t.status === "WAITING" || t.status === "BLOCKED");
  const nextWeek = open.filter((t) => t.dueDate && t.dueDate > td && t.dueDate <= addDays(td, 7) && !t.repeat).sort((a, b) => a.dueDate.localeCompare(b.dueDate) || PRANK[a.priority] - PRANK[b.priority]);
  const nextMin = nextWeek.filter((t) => !hasChildren(t.id)).reduce((s, t) => s + (t.estimatedMinutes || 0), 0);
  const atRisk = db.projects.filter((p) => !isClosedProject(p)).map((p) => ({ p, h: projectHealth(p) })).filter((x) => x.h.level === "RED" || x.h.level === "ORANGE");
  const step = (n, title, sub, body) => `<section class="card"><div class="card-h"><span class="rv-step">${n}</span><h2>${title}</h2><span class="muted small">${sub}</span></div>${body}</section>`;
  const moveBtns = (t) => `<button class="btn btn-sm" data-act="rv-move" data-id="${t.id}" data-to="tomorrow">Tomorrow</button><button class="btn btn-sm" data-act="rv-move" data-id="${t.id}" data-to="monday">Next Monday</button><button class="btn btn-sm" data-act="toggle-done" data-id="${t.id}">${I.check}Done</button><button class="btn btn-sm btn-ghost" data-act="rv-drop" data-id="${t.id}">Drop</button>`;
  return `<div class="row" style="justify-content:space-between"><span class="muted">${db.lastReview ? `Last review ${esc(fmtDue(db.lastReview).toLowerCase())}${daysFromToday(db.lastReview) < -1 ? "" : ""}.` : "Your first weekly review."} Work down the steps; every change saves as you go.</span>
    <button class="btn btn-primary" data-act="rv-finish">${I.check}Finish review</button></div>
  <div class="stats">
    <div class="stat"><span class="stat-n">${doneTasks.length}</span><span class="stat-l">Tasks completed this week</span></div>
    <div class="stat"><span class="stat-n">${routineDone}</span><span class="stat-l">Repeating tasks done</span></div>
    <div class="stat"><span class="stat-n">${fmtMin(focusMin) || "0m"}</span><span class="stat-l">Focus time</span></div>
    <div class="stat ${slipped.length ? "is-danger" : ""}"><span class="stat-n">${slipped.length}</span><span class="stat-l">Slipped past their date</span></div>
  </div>
  ${step(1, "What got done", "Worth a moment before planning", doneTasks.length ? `<div class="card-b small">${doneTasks.slice(0, 12).map((t) => `<span class="chip" style="display:inline-block;margin:0 6px 6px 0">${esc(t.title)}</span>`).join("")}${doneTasks.length > 12 ? `<span class="muted">and ${doneTasks.length - 12} more</span>` : ""}</div>` : `<div class="empty small">Nothing marked complete in the last 7 days.</div>`)}
  ${step(2, "What slipped", "Give each one a new date, finish it, or drop it", slipped.length ? slipped.map((t) => reviewRow(t, moveBtns(t))).join("") : `<div class="empty small">Nothing overdue. Well done.</div>`)}
  ${step(3, "Stale tasks", "Undated, not started, added over two weeks ago", stale.length ? stale.map((t) => reviewRow(t, `<button class="btn btn-sm" data-act="rv-move" data-id="${t.id}" data-to="friday">This Friday</button><button class="btn btn-sm" data-act="rv-move" data-id="${t.id}" data-to="monday">Next Monday</button><button class="btn btn-sm btn-ghost" data-act="rv-keep" data-id="${t.id}">Keep for later</button><button class="btn btn-sm btn-ghost" data-act="rv-drop" data-id="${t.id}">Drop</button>`)).join("") : `<div class="empty small">No stale tasks.</div>`)}
  ${step(4, "Waiting on others", "Follow up on anything that's stuck", waiting.length ? waiting.map((t) => reviewRow(t, `<button class="btn btn-sm" data-act="rv-move" data-id="${t.id}" data-to="tomorrow">Follow up tomorrow</button><button class="btn btn-sm" data-act="toggle-done" data-id="${t.id}">${I.check}Done</button>`)).join("") : `<div class="empty small">Nothing waiting on anyone.</div>`)}
  ${step(5, "Empty the Inbox", plural(db.inbox.length, "captured item"), db.inbox.length ? `<div class="card-b row"><span class="muted" style="flex:1">${esc(db.inbox.slice(0, 3).map((x) => x.text).join(" · "))}${db.inbox.length > 3 ? " …" : ""}</span><button class="btn btn-sm" data-act="nav" data-view="inbox">Open Inbox</button><button class="btn btn-sm btn-primary" data-act="inbox-split">${I.spark}Sort all with Smart add</button></div>` : `<div class="empty small">Inbox is empty.</div>`)}
  ${step(6, "Plan next week", `${plural(nextWeek.length, "task")} due in the next 7 days${nextMin ? `, about ${fmtMin(nextMin)} of estimated work` : ""}`, `${atRisk.length ? `<div class="card-b small" style="color:var(--danger)">${atRisk.map((x) => `<b>${esc(x.p.name)}</b> is ${esc(HEALTH_LABEL[x.h.level].toLowerCase())}: ${esc(x.h.reasons[0])}`).join("<br>")}</div>` : ""}${taskList(nextWeek, {}, "Nothing due next week yet. Add the most important things now.")}<div class="card-b row" style="border-top:1px solid var(--border)"><button class="btn btn-sm" data-act="quick-add">${I.plus}Add task</button><button class="btn btn-sm" data-act="nav" data-view="calendar">${I.calendar}Open calendar</button></div>`)}
  <div class="row" style="justify-content:flex-end"><button class="btn btn-primary" data-act="rv-finish">${I.check}Finish review</button></div>`;
}

function downloadJson(data, name) {
  try {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast("Backup downloaded");
  } catch (e) { toast("Download is not available here. Use Copy backup instead."); }
}

  "safety-restore": (el) => { const c = safetyCopies().find((x) => x.id === el.dataset.id); if (c) importJson(JSON.stringify(c.data)); },
  "safety-delete": (el) => { lsSet(SAFETY_KEY, JSON.stringify(safetyCopies().filter((x) => x.id !== el.dataset.id))); render(); },
  "export-download": () => downloadJson(db, `command-center-backup-${today()}.json`),
  "export-copy": () => {
    const text = JSON.stringify(db, null, 2);
    const fallback = () => { const ta = $("#import-text"); ta.value = text; ta.focus(); ta.select(); toast("Backup text selected. Press Ctrl+C or Cmd+C to copy."); };
    try { navigator.clipboard.writeText(text).then(() => toast("Backup copied. Paste it into a text file to keep it."), fallback); } catch (e) { fallback(); }
  },
  "import-text": () => importJson($("#import-text").value),
  "cycle-theme": () => {
    const order = ["system", "light", "dark"];
    let cur = "system"; try { cur = localStorage.getItem(THEME_KEY) || "system"; } catch (e) {}
    const next = order[(order.indexOf(cur) + 1) % 3];
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme(next); updateThemeButton();
  },
};
function importJson(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { toast("That is not a valid backup. Check you copied the whole file."); return; }
  if (!validDb(data)) { toast("That file is not a Command Center backup."); return; }
  confirmBox({ title: "Restore this backup?", body: `It has ${data.projects.length} projects and ${data.tasks.length} tasks and replaces everything currently in the app.`, label: "Restore backup", danger: false,
    onYes: () => { db = { ...emptyDb(), ...data, phases: data.phases || [], demo: false }; if (!data.game) db.game = null; ensureDb(); save(); go("dashboard"); toast("Backup restored"); } });
}

/* Forms */
const forms = {
  "pay-setup": (form) => {
    const amt = Number($("#pay-amount").value);
    if (!(amt > 0)) { toast("Enter your take-home pay first."); return; }
    const start = $("#pay-start").value, end = $("#pay-end").value;
    if (!start || !end || end < start) { toast("Pick a pay period start, and an end on or after it."); return; }
    const days = Math.round((toDate(end) - toDate(start)) / 864e5) + 1;
    const wd = pickedDays("pay-wd");
    Object.assign(db.pay, { unit: $("#pay-unit").value, amount: Math.round(amt * 100) / 100, periodStart: start, periodDays: Math.min(62, days), stdHours: clamp(Number($("#pay-std").value) || 8, 1, 24), workdays: wd.length ? wd : [1, 2, 3, 4, 5] });
    ui.payOffset = 0; save(); render(); toast("Pay setup saved");
  },
  "pay-manual": (form) => {
    const d = $("#pm-date").value, a = $("#pm-in").value, b = $("#pm-out").value;
    if (!d || !a || !b) { toast("Pick a date, a clock-in time and a clock-out time."); return; }
    const inAt = atTime(d, a); let outAt = atTime(d, b);
    if (outAt <= inAt) outAt = new Date(outAt.getTime() + 864e5); // overnight shift
    db.pay.punches.push({ id: uid(), date: d, in: inAt.toISOString(), out: outAt.toISOString(), breakMin: Math.max(0, Math.round(Number($("#pm-brk").value) || 0)), manual: true });
    save(); render(); toast(`Added ${fmtHours((outAt - inAt) / 36e5 - (Number($("#pm-brk").value) || 0) / 60)} on ${fmtDate(d, { weekday: "short", month: "short", day: "numeric" })}`);
  },
  capture: (form) => {
    const input = $("#qc-text"); const text = input.value.trim();
    if (!text) { input.focus(); return; }
    db.inbox.unshift({ id: uid(), text, createdAt: new Date().toISOString() }); save();
    input.value = ""; input.focus();
    $("#qc-status").textContent = `Saved "${text.length > 50 ? text.slice(0, 50) + "…" : text}". ${plural(db.inbox.length, "item")} in your Inbox. Keep going, or press Esc when you're done.`;
    renderNav(); if (ui.view === "inbox") render();
  },
  "smart-add": () => runSmartSplit(),
  "el-key": (form) => {
    const k = form.elKey.value.trim();
    if (!k) { toast("Paste your ElevenLabs key first."); return; }
    if (!lsSet(EL_KEY, k)) { toast("This browser is blocking storage, so the key can't be saved."); return; }
    el.voices = null; el.failed = ""; el.cache.clear();
    render(); toast("Voice key saved in this browser"); loadElVoices(true);
  },
  "sync-pass": (form) => {
    const k = form.syncPass.value.trim();
    if (!k) { toast("Enter the passcode you set as SYNC_PASSCODE in Vercel."); return; }
    if (!lsSet(SYNC_PASS, k)) { toast("This browser is blocking storage, so the passcode can't be saved."); return; }
    sync.ready = true; render(); syncPull().then(() => { if (sync.state === "saved") toast("Auto-save is on"); });
  },
  "ai-key": (form) => {
    const id = AI_PROVIDERS[form.dataset.provider] ? form.dataset.provider : "anthropic", pv = AI_PROVIDERS[id];
    const k = form.aiKey.value.trim();
    if (!k) { toast("Paste your API key first."); return; }
    const switchTo = !aiKey(); // nothing usable yet: start using the key just saved
    if (!lsSet(pv.key, k)) { toast("This browser is blocking storage, so the key can't be saved."); return; }
    if (switchTo) { lsSet(AI_PROVIDER, id); lsSet(AI_MODE, "ai"); }
    render(); toast(`${pv.label} key saved in this browser${switchTo ? `. Smart add now uses ${pv.label}` : ""}`);
  },
  "quick-add": (form) => {
    const f = quickAddFields();
    if (!f.title) { toast("Add a title for the task."); return; }
    const tp = db.templates.find((x) => x.id === form.dataset.template && x.title === f.title);
    const t = createTask({ ...f, myDay: form.myday.checked || (f.repeat && nextOccurrence(f.repeat, f.dueDate || today()) === today()) ? today() : null }, tp);
    if (form.dataset.inbox) db.inbox = db.inbox.filter((x) => x.id !== form.dataset.inbox);
    save(); closeOverlay(); render();
    toast(`Added "${t.title}"${t.repeat ? `, ${repeatLabel(t.repeat.days).toLowerCase()}${t.dueTime ? " at " + fmtSlot(t) : ""}` : t.dueDate ? ", due " + fmtDue(t.dueDate).toLowerCase() : ""}`);
  },
  project: (form) => {
    const fd = new FormData(form);
    const fields = { name: fd.get("name").trim(), description: fd.get("description").trim(), status: fd.get("status"), priority: fd.get("priority"), startDate: fd.get("startDate") || null, targetDate: fd.get("targetDate") || null, color: fd.get("color") || COLORS[0] };
    if (!fields.name) return;
    if (form.dataset.id) { Object.assign(projById(form.dataset.id), fields); save(); closeOverlay(); render(); toast("Project saved"); return; }
    const p = { id: uid(), createdAt: new Date().toISOString(), order: db.projects.length, ...fields };
    db.projects.push(p);
    String(fd.get("phases") || "").split("\n").map((s) => s.trim()).filter(Boolean).forEach((name, i) => db.phases.push({ id: uid(), projectId: p.id, name, order: i }));
    save(); closeOverlay(); go("project", { projectId: p.id }); toast("Project created");
  },
  "rename-phase": (form) => { const ph = phaseById(form.dataset.id); if (ph && form.phaseName.value.trim()) { ph.name = form.phaseName.value.trim(); save(); } closeOverlay(); render(); },
  "add-phase": (form) => {
    const name = form.phaseName.value.trim(); if (!name) return;
    db.phases.push({ id: uid(), projectId: form.dataset.project, name, order: phasesOf(form.dataset.project).length });
    save(); render(); const i = $("#new-phase-name"); if (i) i.focus();
  },
  "add-subtask": (form) => {
    const parent = taskById(form.dataset.id); const title = form.subTitle.value.trim(); if (!parent || !title) return;
    newTask({ title, parentId: parent.id, projectId: parent.projectId, phaseId: parent.phaseId, priority: parent.priority });
    if (parent.status === "COMPLETED") setStatus(parent, "IN_PROGRESS");
    save(); render(); refreshDrawer("#d-new-sub");
  },
  "add-check": (form) => {
    const t = taskById(form.dataset.id); const text = form.text.value.trim(); if (!t || !text) return;
    t.checklist = [...(t.checklist || []), { id: uid(), text, done: false }];
    save(); render(); refreshDrawer("#d-new-check");
  },
};

/* Drawer field edits */
function applyField(el) {
  const t = taskById(ui.drawerTask); if (!t) return;
  const f = el.dataset.field; const v = el.value;
  let structural = false;
  if (f === "title") { if (!v.trim()) { el.value = t.title; return; } t.title = v.trim(); }
  else if (f === "status") { setStatus(t, v); structural = true; }
  else if (f === "priority") t.priority = v;
  else if (f === "dueDate") t.dueDate = v || null;
  else if (f === "dueTime") { t.dueTime = v || null; if (!v) t.endTime = null; if (v && !t.dueDate) { t.dueDate = today(); structural = true; } }
  else if (f === "endTime") {
    if (v && !t.dueTime) { toast("Set a start time first."); el.value = ""; return; }
    if (v && !slotMinutes(t.dueTime, v)) { toast("The end time needs to be after the start time."); el.value = t.endTime || ""; return; }
    t.endTime = v || null; if (v && !t.estimatedMinutes) { t.estimatedMinutes = slotMinutes(t.dueTime, v); structural = true; }
  }
  else if (f === "repeatDay") {
    const days = pickedDays("d-day");
    t.repeat = days.length ? { days, until: (t.repeat && t.repeat.until) || null } : null;
    if (t.repeat) alignRepeat(t);
    structural = true;
  }
  else if (f === "repeatUntil") { if (t.repeat) t.repeat.until = v || null; }
  else if (f === "estimatedMinutes") t.estimatedMinutes = v === "" ? null : Math.max(0, Math.round(Number(v)));
  else if (f === "progressOverride") t.progressOverride = v === "" ? null : clamp(Math.round(Number(v)), 0, 100);
  else if (f === "tags") t.tags = v.split(",").map((s) => s.trim().replace(/^#/, "").toLowerCase()).filter(Boolean);
  else if (f === "description") t.description = v;
  else if (f === "owner") { t.owner = v.trim() && !ME_RX.test(v.trim()) ? v.trim() : null; }
  else if (f === "projectId") {
    for (const id of subtreeIds(t.id)) { const x = taskById(id); x.projectId = v || null; x.phaseId = null; }
    structural = true;
  } else if (f === "phaseId") { for (const id of subtreeIds(t.id)) taskById(id).phaseId = v || null; }
  save(); render();
  if (structural) refreshDrawer("#" + el.id);
}

/* ---------- Theme ---------- */
function applyTheme(mode) {
  if (mode === "light" || mode === "dark") document.documentElement.setAttribute("data-theme", mode);
  else document.documentElement.removeAttribute("data-theme");
}
function updateThemeButton() {
  let cur = "system"; try { cur = localStorage.getItem(THEME_KEY) || "system"; } catch (e) {}
  const b = $("#theme-btn span"); if (b) b.textContent = { system: "Theme: match system", light: "Theme: light", dark: "Theme: dark" }[cur];
}

/* ---------- Wiring ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (el && actions[el.dataset.act]) {
    if (el.closest(".bcard") && el.dataset.act === "open-task" && el.classList.contains("dragging")) return;
    e.preventDefault(); actions[el.dataset.act](el, e); return;
  }
  if (e.target.matches("[data-overlay]")) closeOverlay();
});
document.addEventListener("submit", (e) => {
  const form = e.target.closest("[data-form]");
  if (form && forms[form.dataset.form]) { e.preventDefault(); forms[form.dataset.form](form); }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.field) return applyField(el);
  if (el.dataset.sf) return smartField(el);
  if (el.dataset.pay) return payField(el);
  if (el.dataset.bset) { const k = el.dataset.bset; saveBriefSettings({ [k]: k === "listen" ? el.checked : k === "rate" ? Number(el.value) : el.value, ...(k === "time" ? { lastReminded: "" } : {}) }); toast(k === "time" ? (el.value ? `Briefing reminder set for ${fmtTime(el.value)}` : "Briefing reminder turned off") : "Saved"); return; }
  if (el.hasAttribute("data-smode")) { lsSet(AI_MODE, el.value); updateAiNote(); return; }
  if (el.hasAttribute("data-aiprov")) { lsSet(AI_PROVIDER, el.value); render(); toast(`Smart add will use ${AI_PROVIDERS[el.value].label}${lsGet(AI_PROVIDERS[el.value].key) ? "" : ". Save its key below"}`); return; }
  if (el.id === "sa-project" || el.id === "sa-phase") {
    if (el.id === "sa-project") { smart.projectId = el.value; smart.phaseId = ""; fillPhaseSelect($("#sa-phase"), el.value, ""); }
    else smart.phaseId = el.value;
    smart.items.forEach((it) => { if (!it.fromText) { it.projectId = smart.projectId || null; it.phaseId = smart.phaseId || null; } });
    renderSmartPreview(); return;
  }
  if (el.dataset.filter === "board") { ui.boardProject = el.value; render(); return; }
  if (el.dataset.filter) { ui.filters[el.dataset.filter] = el.value; render(); const again = $("#" + el.id); if (again) again.focus(); return; }
  if (el.id === "import-file" && el.files[0]) { const r = new FileReader(); r.onload = () => importJson(String(r.result)); r.readAsText(el.files[0]); el.value = ""; }
});
document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.key === "Escape") { if ($("#overlay-root").innerHTML) { closeOverlay(); e.preventDefault(); } else if (typing) e.target.blur(); return; }
  if (e.key === "Enter" && e.target.classList.contains("bcard")) { openTask(e.target.dataset.id); return; }
  if (e.key === "Enter" && e.target.id === "d-title") { e.target.blur(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "n" || e.key === "N") { e.preventDefault(); openQuickAdd(ui.view === "project" ? { projectId: ui.projectId } : {}); }
  if (e.key === "s" || e.key === "S") { e.preventDefault(); openSmartAdd(ui.view === "project" ? { projectId: ui.projectId } : {}); }
  if (e.key === "b" || e.key === "B") { e.preventDefault(); go("briefing"); }
  if (e.key === "c" || e.key === "C") { e.preventDefault(); openCapture(); }
  if (e.key === "m" || e.key === "M") { e.preventDefault(); openSmartAdd({ meeting: true }); }
  if (e.key === "f" || e.key === "F") { e.preventDefault(); openFocus(); }
  if (e.key === "/") { e.preventDefault(); $("#global-search").focus(); }
});

renderShell();
let theme = "system"; try { theme = localStorage.getItem(THEME_KEY) || "system"; } catch (e) {}
applyTheme(theme); updateThemeButton();
$("#global-search").addEventListener("input", (e) => {
  ui.q = e.target.value;
  if (ui.q.trim()) { if (ui.view !== "search") { ui.prevView = ui.view; ui.view = "search"; } render(); }
  else if (ui.view === "search") { ui.view = ui.prevView || "dashboard"; render(); }
});
const initial = (location.hash || "").slice(1);
if (TITLES[initial] && initial !== "project" && initial !== "search") ui.view = initial;
if (/[?&]briefing(=1|&|$)/.test(location.search)) ui.view = "briefing";
(() => { // opened around the briefing time: start on the briefing screen
  const t = briefSettings().time; if (!t) return;
  const [h, m] = t.split(":").map(Number); const at = new Date(); at.setHours(h, m, 0, 0);
  const diff = Date.now() - at; if (diff > -30 * 60e3 && diff < 3 * 3600e3) ui.view = "briefing";
})();
if (canSpeak()) speechSynthesis.onvoiceschanged = () => { if (ui.view === "briefing" && brief.state !== "speaking" && brief.state !== "paused") render(); };
setInterval(() => { if (rollRepeats()) { save(); if (!$("#overlay-root").innerHTML) render(); } checkBriefingReminder(); }, 30000);
rollRepeats();
setInterval(paintClock, 1000);
setTimeout(checkBriefingReminder, 1500);
save();
render();
syncStart();
})();
</script>
</body>
